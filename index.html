    }
    header {
      background: linear-gradient(135deg, #6b1d29 0%, #8b2635 60%, #a83848 100%);

    header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
    header .sub { font-size: 12px; opacity: 0.9; margin-top: 2px; }
    .day-scroller {
      display: flex; overflow-x: auto; gap: 8px; padding: 10px 12px;
      background: #fff; border-bottom: 1px solid var(--border);
      position: sticky; top: 68px; z-index: 35; scrollbar-width: none;
    }
    .day-scroller::-webkit-scrollbar { display: none; }
    .day-pill {
      flex: 0 0 auto; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: #f9fafb; font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer;
      text-align: center; transition: all 0.2s;
    }
    .day-pill.active {
      background: var(--primary); color: #fff; border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(139,38,53,0.3);
    }
    .day-pill span { display: block; font-size: 10px; font-weight: 400; opacity: 0.85; }
    .container { max-width: 680px; margin: 0 auto; padding: 12px; }
    .card {
      background: var(--card); border-radius: 14px; padding: 14px; margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06); border: 1px solid rgba(0,0,0,0.04);
    }
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 600;
    }
    .badge-red { background: var(--primary-light); color: var(--primary); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }
    .badge-green { background: var(--green-bg); color: var(--green); }
    .depart-banner {
      background: #fffbeb; border-left: 4px solid var(--accent); padding: 10px 12px;
      border-radius: 8px; margin: 10px 0; font-size: 13px; font-weight: 600; color: #92400e;
    }
    .weather-box {
      display: flex; justify-content: space-between; align-items: center;
      background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px; font-size: 12px;
    }
    .weather-temp { font-size: 16px; font-weight: 700; color: #0369a1; }
    .notice-box {
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;
      padding: 10px 12px; font-size: 13px; color: #991b1b; margin-bottom: 10px;
    }
    .section-title {
      font-size: 14px; font-weight: 700; color: var(--primary); margin: 12px 0 8px;
      display: flex; align-items: center; gap: 6px;
    }
    .item-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 10px 0; border-bottom: 1px dashed var(--border);
    }
    .item-row:last-child { border-bottom: none; }
    .item-name { font-size: 14px; font-weight: 500; }
    .map-btn {
      flex: 0 0 auto; background: var(--blue-bg); color: var(--blue); text-decoration: none;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .hotel-nav-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: var(--green); color: #fff; text-decoration: none;
      padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 700;
      margin-top: 12px; box-shadow: 0 3px 8px rgba(21,128,61,0.25);

      display: inline-flex; align-items: center; gap: 4px; background: #f3f4f6;

      border-top: 1px solid var(--border); display: flex; z-index: 50;

    }
    .tab-item {
      flex: 1; text-align: center; padding: 8px 4px; font-size: 11px; color: var(--muted);

    .view { display: none; }
    .view.active { display: block; }
    .search-input {
      width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #d1d5db;
      font-size: 14px; margin-bottom: 10px;
    }
    .ref-card {
      background: #fff; border-radius: 12px; margin-bottom: 10px;
      border: 1px solid var(--border); overflow: hidden;
    }

    .calc-input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; }
    .btn-download {
      background: var(--primary); color: #fff; border: none; padding: 12px 16px;

</head>

          <p>• <strong>重要激活規定：</strong>下載官方 <strong>PID Lítačka App</strong> 購票後，務必在搭車前點擊 <strong>「Activate」</strong>，系統會有 <strong>2 分鐘倒數</strong>，倒數完畢才算有效票（紙本票則須在黃色打卡機打時間章）。</p>
        `
      },
      {
        id: "布拉格伏爾塔瓦河遊船", title: "⛵ 布拉格伏爾塔瓦河遊船比較與兩大碼頭位置",
        html: `
          <table class="ref-table">
            <tr><th>船種</th><th>價格</th><th>特色</th></tr>
            <tr><td>經典 50 分鐘觀光船</td><td>€14 – €18</td><td>經過查理大橋下，含中文音訊導覽。</td></tr>
            <tr><td>魔鬼河微型木船</td><td>€20 – €24</td><td><strong>超推薦！</strong>深入狹窄古老水車水道，含免費飲料/熱紅酒與毛毯。</td></tr>
            <tr><td>全景玻璃景觀船</td><td>€22 – €30</td><td>現代化暖氣玻璃船艙，冬季防風保暖首選。</td></tr>
          </table>
          <p>• <strong>認清兩大碼頭：</strong>Prague Venice 魔鬼河小木船在 <strong>查理大橋橋頭碼頭 (Judita Pier)</strong>；Prague Boats 大型玻璃船在 <strong>切赫橋碼頭 (Čech Bridge Pier)</strong>。</p>
        `
      },
      {
        id: "布拉格到機場交通", title: "🛫 12/18 布拉格到機場交通與退稅時間軸",
        html: `
          <p>• <strong>最推薦（叫車 Bolt / Uber）：</strong>06:45 飯店門口上車，清晨不塞車約 25–30 分鐘直達航廈（車資約 400–600 CZK），免在寒風中拖行李走石板路。</p>
          <p>• <strong>CP 值備案（地鐵 A 線 + 59 號無軌電車）：</strong>06:30 出發，搭地鐵 A 線至 Nádraží Veleslavín 站轉 59 號電車（約 40–45 分鐘，含在交通 Pass 內；不建議搭單程 100 CZK 的 AE 巴士）。</p>
          <p>• <strong>12/18 機場時間軸：</strong>06:45 出發 ➔ 07:15 抵達先辦退稅海關蓋章（托運退稅品先別託運！）➔ 航空公司 Check-in 託運 ➔ 08:30 過安檢免稅店 ➔ 10:30 起飛。</p>
        `
      },
      {
        id: "住宿選區", title: "🏨 四大城市住宿選區黃金地段總結速查表",
        html: `
          <table class="ref-table">
            <tr><th>城市</th><th>首選住宿區</th><th>核心交通優勢</th></tr>
            <tr><td>維也納</td><td>中央車站區 (Wien Hbf)</td><td>跨國火車/斯洛伐克一日遊零距離，U1 地鐵 5 分鐘進市中心，車站超市週日也營業。</td></tr>
            <tr><td>布達佩斯</td><td>佩斯第 V 區 (Belváros)</td><td>Deák Ferenc tér 三線地鐵交會，步行即達聖誕市集與遊船碼頭。</td></tr>
            <tr><td>薩爾斯堡</td><td>中央車站區 (Salzburg Hbf)</td><td>Bus 150（哈修塔特）與 Bus 25（溫特斯山）起點，免拖行李走石板路。</td></tr>
            <tr><td>布拉格</td><td>舊城區邊緣 / 瓦茨拉夫廣場</td><td>景點全步行可達，生活採買方便，專車直接送達。</td></tr>
          </table>
        `
      }
    ];

    const CHECKLIST_ITEMS = [
      "ÖBB App 購買「維也納 7 日通票 (€25.20)」＋「機場到 Schwechat 單程延伸票 (€2.20)」",
      "ÖBB App 跨國火車票（RJX267、RJX 62、RJX 160、IC 641 + EC 334）並完成劃位",
      "出發前一天於 ÖBB App 購買 Bratislava-Ticket (€19)",
      "薩爾斯堡卡 48 小時兌換憑證（抵達 Salzburg Hbf 左側走廊旅遊中心換實體卡）",
      "下載 BudapestGO App（布達佩斯 72h 通票）與 PID Lítačka App（布拉格 72h+24h 通票）",
      "熱門餐廳預約：Figlmüller、New York Café、Ribs of Vienna、Imperial Café",
      "布達佩斯塞切尼溫泉裝備：泳衣、夾腳拖、大浴巾"
    ];

    let currentDay = 1;
    const weatherCache = {};

    function mapLink(q) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
    }

    function renderScroller() {
      const el = document.getElementById("dayScroller");
      el.innerHTML = ITINERARY.map((item, idx) => `
        <button class="day-pill ${idx === currentDay ? 'active' : ''}" onclick="selectDay(${idx})">
          Day ${item.day}
          <span>${item.date.split(' ')[0]} ${item.city}</span>
        </button>
      `).join("");
    }

    async function fetchWeather(idx) {
      const item = ITINERARY[idx];
      const key = `${item.lat},${item.lon}`;
      if (weatherCache[key]) return weatherCache[key];
      try {
        const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${item.lat}&longitude=${item.lon}&current=temperature_2m,precipitation_probability&timezone=auto`);
        const data = await res.json();
        if (data && data.current) {
          weatherCache[key] = {
            temp: `${Math.round(data.current.temperature_2m)}°C`,
            rain: `${data.current.precipitation_probability ?? 20}%`
          };
          return weatherCache[key];
        }
      } catch (e) {}
      return null;
    }

    async function selectDay(idx) {
      currentDay = idx;
      renderScroller();
      const item = ITINERARY[idx];
      const box = document.getElementById("dayContent");

      box.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="badge badge-red">DAY ${item.day}・${item.date}</span>
            <span class="badge badge-blue">${item.country}・${item.city}</span>
          </div>

          <div class="depart-banner">⏰ 飯店出發提醒：${item.depart}</div>

          <div class="weather-box" id="weatherBox">
            <div>
              <div style="font-weight:700;color:#0c4a6e;">🌤️ 當地氣候參考（${item.city}）</div>
              <div style="color:#0369a1;">12月冬季均溫：${item.winter}</div>
            </div>
            <div style="text-align:right;">
              <div class="weather-temp" id="liveTemp">載入即時氣溫...</div>
              <div style="font-size:11px;color:#0284c7;" id="liveRain">Open-Meteo</div>
            </div>
          </div>

          <div class="notice-box">⚠️ <strong>當日重要注意事項：</strong>${item.notice}</div>

          <div class="section-title">🚄 交通與推薦班次規劃</div>
          <div style="font-size:13px;background:#f9fafb;padding:10px;border-radius:8px;border:1px solid #e5e7eb;">
            ${item.transport}
          </div>

          <div class="section-title">📍 必去景點與 Google 地圖導航</div>
          ${item.spots.map(s => `
            <div class="item-row">
              <span class="item-name">${s}</span>
              <a class="map-btn" href="${mapLink(s + ' ' + item.city)}" target="_blank">📍 Google 地圖</a>
            </div>
          `).join("")}

          <div class="section-title">🍽️ 必吃美食與咖啡館導航</div>
          ${item.foods.map(f => `
            <div class="item-row">
              <span class="item-name">${f}</span>
              <a class="map-btn" href="${mapLink(f.split('（')[0] + ' ' + item.city)}" target="_blank">🍴 Google 地圖</a>
            </div>
          `).join("")}

          ${item.refs.length ? `
            <div class="section-title">📚 本日關聯參考攻略（點擊查看）</div>
            <div>
              ${item.refs.map(r => `<span class="ref-chip" onclick="openGuide('${r}')">📖 ${r}</span>`).join("")}
            </div>
          ` : ""}

          <a class="hotel-nav-btn" href="${mapLink(item.hotelQuery)}" target="_blank">
            🏨 一鍵 Google 地圖導航回飯店（${item.hotel}）
          </a>
        </div>
      `;

      const live = await fetchWeather(idx);
      if (live && document.getElementById("liveTemp")) {
        document.getElementById("liveTemp").textContent = `即時 ${live.temp}`;
        document.getElementById("liveRain").textContent = `降雨機率 ${live.rain}`;
      } else if (document.getElementById("liveTemp")) {
        document.getElementById("liveTemp").textContent = item.winter.split('/')[0];
        document.getElementById("liveRain").textContent = "冬季氣候參考";
      }
    }

    function renderGuides(filter = "") {
      const list = document.getElementById("guidesList");
      const kw = filter.trim().toLowerCase();
      list.innerHTML = GUIDES.filter(g => !kw || g.title.toLowerCase().includes(kw) || g.html.toLowerCase().includes(kw))
        .map(g => `
          <div class="ref-card ${kw ? 'open' : ''}" id="guide-${g.id}">
            <div class="ref-header" onclick="this.parentElement.classList.toggle('open')">
              <span>${g.title}</span>
              <span>▼</span>
            </div>
            <div class="ref-body">${g.html}</div>
          </div>
        `).join("");
    }

    function openGuide(id) {
      switchTab('guides', document.querySelectorAll('.tab-item')[1]);
      renderGuides();
      const target = document.getElementById(`guide-${id}`);
      if (target) {
        target.classList.add('open');
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function switchTab(name, btn) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(`view-${name}`).classList.add('active');
      document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function conv(src) {
      const rates = { eur: 1, twd: 35.2, huf: 405, czk: 25.2 };
      const val = parseFloat(document.getElementById(`c-${src}`).value);
      if (isNaN(val)) return;
      const inEur = val / rates[src];
      Object.keys(rates).forEach(k => {
        if (k !== src) document.getElementById(`c-${k}`).value = (inEur * rates[k]).toFixed(k === 'huf' ? 0 : 1);
      });
    }

    function renderChecklist() {
      const saved = JSON.parse(localStorage.getItem('trip2026_checks') || '{}');
      document.getElementById('checklist').innerHTML = CHECKLIST_ITEMS.map((txt, i) => `
        <label style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed #e5e7eb;font-size:13px;cursor:pointer;">
          <input type="checkbox" ${saved[i] ? 'checked' : ''} onchange="toggleCheck(${i}, this.checked)" style="margin-top:3px;">
          <span style="${saved[i] ? 'text-decoration:line-through;color:#9ca3af;' : ''}">${txt}</span>
        </label>
      `).join('');
    }

    function toggleCheck(i, val) {
      const saved = JSON.parse(localStorage.getItem('trip2026_checks') || '{}');
      saved[i] = val;
      localStorage.setItem('trip2026_checks', JSON.stringify(saved));
      renderChecklist();
    }

    function downloadSelf() {
      const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([html], { type: "text/html;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    document.getElementById("guideSearch").addEventListener("input", e => renderGuides(e.target.value));
    selectDay(1); // 預設顯示 DAY 2 (12/03 維也納) 方便確認最新修改
    renderGuides();
    renderChecklist();
  </script>
</body>
</html>
